<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#30bced" />
    <meta name="description" content="Sistema de Gestión de Preventas para vendedores" />
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ASTR" />
    <meta name="application-name" content="ASTR" />
    
    <!-- Icons -->
    <link rel="icon" href="%PUBLIC_URL%/assets/images/favicon.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/assets/images/icon.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="%PUBLIC_URL%/assets/images/icon.png" />
    <link rel="apple-touch-icon" sizes="96x96" href="%PUBLIC_URL%/assets/images/icon.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="%PUBLIC_URL%/assets/images/icon.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="%PUBLIC_URL%/assets/images/icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/assets/images/icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/assets/images/icon.png" />
    <link rel="apple-touch-icon" sizes="384x384" href="%PUBLIC_URL%/assets/images/icon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="%PUBLIC_URL%/assets/images/icon.png" />
    
    <!-- Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Splash Screen -->
    <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/assets/images/splash.png" />
    
    <title>ASTR - Sistema de Gestión de Preventas</title>
    
    <style>
        /* Estilos de carga inicial */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #f5f5f5;
        }
        
        #root {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .loading-screen {
            text-align: center;
            color: #333;
        }
        
        .loading-screen h1 {
            font-size: 24px;
            margin-bottom: 16px;
            color: #30bced;
        }
        
        .loading-screen p {
            font-size: 16px;
            margin: 0;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #30bced;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
    <div id="root">
        <div class="loading-screen">
            <h1>ASTR</h1>
            <div class="spinner"></div>
            <p>Cargando aplicación...</p>
        </div>
    </div>
    
    <script>
        // Registrar Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('✅ Service Worker registrado exitosamente:', registration.scope);
                        
                        // Verificar actualizaciones
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // Hay una nueva versión disponible
                                    console.log('🔄 Nueva versión disponible');
                                    if (confirm('Hay una nueva versión disponible. ¿Deseas actualizar?')) {
                                        newWorker.postMessage({ type: 'SKIP_WAITING' });
                                        window.location.reload();
                                    }
                                }
                            });
                        });
                    })
                    .catch((registrationError) => {
                        console.log('❌ Error al registrar Service Worker:', registrationError);
                    });
            });
        }
        
        // Detectar si la app puede ser instalada
        window.addEventListener('beforeinstallprompt', (e) => {
            console.log('📱 PWA puede ser instalada');
            // Guardar el evento para mostrarlo más tarde
            window.deferredPrompt = e;
        });
        
        // Detectar si la app ya está instalada
        window.addEventListener('appinstalled', (evt) => {
            console.log('✅ ASTR instalado exitosamente');
        });
    </script>
</body>
</html>
